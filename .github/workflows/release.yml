name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Track the repo's go directive (go.mod). actions/setup-go@v6 sets
          # GOTOOLCHAIN=local, so a static pin here cannot auto-upgrade to
          # satisfy go.mod's `go 1.25.4` — building from go.mod keeps the
          # workflow in sync with whatever the codebase requires.
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          # Stamp the tag's version and build time into the binary so
          # `starlims-lsp --version` and the LSP serverInfo report the
          # release, not "dev (built unknown)".
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o "dist/starlims-lsp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/starlims-lsp

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: starlims-lsp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    # Attach all assets from a single job — concurrent uploads from the
    # build matrix raced on the shared THIRD-PARTY-NOTICES.md (the release
    # action deletes-then-recreates an existing asset, so two jobs
    # overwriting the same file collide with a 404).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Release notes come from the tag's CHANGELOG.md section. Downstream
      # consumers (ssl-style-guide MCP pickup tooling) read the release
      # body, so an empty-notes release breaks their update flow.
      - name: Extract changelog section for release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*
            THIRD-PARTY-NOTICES.md
